name: Native Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native regression and self-contained portable build
        shell: pwsh
        run: ./scripts/build-native.ps1
      - name: Windows API and protected IPC
        shell: pwsh
        run: dotnet run --project native/RamFlow.Tests -c Release -- --windows --ipc
      - name: Build policy replay tool
        shell: pwsh
        run: |
          dotnet build scripts/ResearchReplay -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_research_replay.py
      - name: ResearchLab disposable Windows integration
        shell: pwsh
        run: |
          dotnet build scripts/ResearchLab -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_research_budget_policy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_research_budget_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_research_budget_clock.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_research_cpu_worker_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_owned_process_qos_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_research_lab_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_research_logging_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RamFlow-native-windows-x64
          path: |
            dist/RamFlow-0.4.0-carp.2-research-windows-x64.zip
            dist/RamFlow-0.4.0-carp.2-research-windows-x64.zip.sha256.txt
            artifacts/native-dashboard.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RamFlow-research-logging-diagnostics
          path: |
            work/logging-integration-*/
            work/lab-windows-smoke-*/
